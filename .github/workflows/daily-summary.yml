name: Publish daily debt summary

# Refreshes reports/latest-summary.json from /api/dashboard-summary so the Lark
# daily-report routine (which cannot reach vercel.app directly — its sandbox
# only allows api.github.com) can read fresh numbers via the GitHub Contents API.
on:
  schedule:
    # GitHub delays scheduled runs by 4-8h in practice (a lone 17:50 run landed ~00:30 next day, so the 18:00 Lark card always read
    # yesterday's numbers — found 2026-10-09). Fire several times earlier in the day so one lands before 18:00 Bangkok (11:00 UTC).
    - cron: '0 0,2,4,6,8 * * *'
    - cron: '50 10 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch dashboard summary
        run: |
          mkdir -p reports
          curl -sS --fail https://debt-tracker-amber-five.vercel.app/api/dashboard-summary -o reports/latest-summary.json
          cat reports/latest-summary.json
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/latest-summary.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update daily debt summary [skip ci]"
          git push
