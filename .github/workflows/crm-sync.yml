name: CRM Debt Reconciliation

on:
  # ปิด schedule ไว้ก่อนระหว่างทดสอบ — หลังตรวจผล dry-run แล้วให้เอา # หน้า 2 บรรทัดนี้ออก
  # schedule:
  #   - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry run (true = ไม่เขียนข้อมูล แค่สรุปผล)'
        required: true
        default: 'true'
      only_so:
        description: 'เลข SO เฉพาะที่ต้องการซิงก์ (คั่นด้วย , — เว้นว่าง = ทุกออเดอร์)'
        required: false
        default: ''

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run CRM reconciliation
        env:
          CRM_USERNAME: ${{ secrets.CRM_USERNAME }}
          CRM_PASSWORD: ${{ secrets.CRM_PASSWORD }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true') && '1' || '' }}
          ONLY_SO: ${{ github.event_name == 'workflow_dispatch' && inputs.only_so || '' }}
        run: node scripts/reconcile.js
