name: CRM Debt Reconciliation

on:
  schedule:
    # GitHub delays/skips scheduled runs (observed 6-9h gaps vs the 2h target, 2026-11-17), so fire two staggered
    # runs per 2h slot; the concurrency group below keeps them from overlapping and writing state at the same time.
    - cron: '7 */2 * * *'
    - cron: '37 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry run (true = ไม่เขียนข้อมูล แค่สรุปผล)'
        required: true
        default: 'true'
      only_so:
        description: 'เลข SO เฉพาะที่ต้องการซิงก์ (คั่นด้วย , — เว้นว่าง = ทุกออเดอร์)'
        required: false
        default: ''

concurrency:
  group: crm-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run CRM reconciliation
        env:
          CRM_USERNAME: ${{ secrets.CRM_USERNAME }}
          CRM_PASSWORD: ${{ secrets.CRM_PASSWORD }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true') && '1' || '' }}
          ONLY_SO: ${{ github.event_name == 'workflow_dispatch' && inputs.only_so || '' }}
        run: node scripts/reconcile.js
