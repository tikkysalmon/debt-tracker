name: CRM Debt Reconciliation

on:
  schedule:
    - cron: '0 2,4,6,8,10,12,14,16 * * 1-5'
  workflow_dispatch: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run CRM reconciliation
        env:
          CRM_USERNAME: ${{ secrets.CRM_USERNAME }}
          CRM_PASSWORD: ${{ secrets.CRM_PASSWORD }}
        run: node scripts/reconcile.js
