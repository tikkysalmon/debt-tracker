<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>พิจารณาอนุมัติตัดจำหน่ายหนี้สูญ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Prompt', 'Sarabun', 'Noto Sans Thai', sans-serif;
    background: #fbf7f2;
    color: #212529;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg,#f7823b,#f0630f); display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 6px 16px rgba(247,130,59,0.3); }
  .title { font-weight: 700; font-size: 18px; }
  .subtitle { font-size: 12.5px; color: #8d93a0; }
  .card { background: #fff; border: 1px solid rgba(247,130,59,0.14); border-radius: 18px; padding: 22px 22px; box-shadow: 0 8px 26px rgba(247,130,59,0.08); margin-bottom: 18px; }
  .center { text-align: center; padding: 50px 20px; color: #8d93a0; font-size: 14px; }
  .doc-title { text-align: center; font-weight: 700; font-size: 17px; margin-bottom: 4px; }
  .doc-id { text-align: center; font-size: 12px; color: #8d93a0; margin-bottom: 18px; }
  .status-badge { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 12.5px; font-weight: 700; margin-bottom: 16px; }
  .meta-row { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-bottom: 1px dashed rgba(247,130,59,0.15); color: #6b7280; }
  .meta-row b { color: #212529; font-weight: 600; }
  table.items { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 13px; }
  table.items th { text-align: left; padding: 8px 10px; background: rgba(247,130,59,0.06); color: #6b7280; font-size: 11px; }
  table.items td { padding: 8px 10px; border-top: 1px solid rgba(247,130,59,0.1); }
  .total-row { text-align: right; font-weight: 700; font-size: 15px; color: #e03131; margin: 6px 0 4px; }
  .pdf-link { display: inline-block; margin-top: 8px; color: #f7823b; font-weight: 600; font-size: 13px; text-decoration: none; }
  .name-field { margin-bottom: 16px; }
  .name-field label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 6px; }
  .name-field input { width: 100%; box-sizing: border-box; padding: 11px 14px; border-radius: 10px; border: 1px solid rgba(247,130,59,0.25); background: #fafafa; font-size: 14px; color: #212529; font-family: inherit; outline: none; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  button.act { flex: 1; min-width: 120px; border: none; padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; color: #fff; }
  button.act:disabled { opacity: 0.5; cursor: default; }
  button.approve { background: linear-gradient(135deg,#0ca678,#0b7a5b); }
  button.reject { background: #fff; color: #e03131; border: 1px solid rgba(224,49,49,0.4); }
  button.hold { background: #fff; color: #6b7280; border: 1px solid rgba(107,114,128,0.35); }
  button.sign { background: linear-gradient(135deg,#0ca678,#0b7a5b); width: 100%; }
  .reason-box { margin-top: 12px; }
  .reason-box textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(224,49,49,0.3); font-family: inherit; font-size: 13px; resize: vertical; min-height: 60px; }
  .error-box { background: rgba(224,49,49,0.06); border: 1px solid rgba(224,49,49,0.25); color: #b3261e; padding: 14px 16px; border-radius: 12px; font-size: 13.5px; }
  .result-note { padding: 16px; border-radius: 12px; font-size: 13.5px; line-height: 1.6; }
  .result-note.good { background: rgba(11,122,91,0.06); border: 1px solid rgba(11,122,91,0.25); color: #0b7a5b; }
  .result-note.bad { background: rgba(224,49,49,0.06); border: 1px solid rgba(224,49,49,0.25); color: #b3261e; }
  .result-note.pending { background: rgba(194,101,10,0.06); border: 1px solid rgba(194,101,10,0.25); color: #c2650a; }
  .footer-note { font-size: 11px; color: #b0b5bd; text-align: center; margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">🗑️</div>
    <div>
      <div class="title">พิจารณาอนุมัติตัดจำหน่ายหนี้สูญ</div>
      <div class="subtitle">ระบบติดตามหนี้ · แซลม่อน เอ็นเตอร์ไพรส์</div>
    </div>
  </div>
  <div id="app" class="card"><div class="center">⏳ กำลังโหลดเอกสาร...</div></div>
  <div class="footer-note">ลิงก์นี้ใช้ได้เฉพาะผู้ที่ได้รับมาโดยตรง — กรุณาอย่าส่งต่อ<br>หากไม่ใช่ผู้ที่ควรพิจารณาเอกสารนี้ กรุณาปิดหน้านี้</div>
</div>

<script>
(function () {
  var STATUS_META = {
    pending: { label: 'รอพิจารณา', bg: 'rgba(194,101,10,0.10)', color: '#c2650a' },
    approved: { label: 'อนุมัติแล้ว · รอเซ็น', bg: 'rgba(11,122,91,0.10)', color: '#0b7a5b' },
    rejected: { label: 'ไม่อนุมัติ', bg: 'rgba(224,49,49,0.10)', color: '#e03131' },
    signed: { label: 'เสร็จสมบูรณ์ — เซ็นแล้ว', bg: 'rgba(11,122,91,0.10)', color: '#0b7a5b' }
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtMoney(n) {
    var v = Number(n || 0);
    if (!isFinite(v)) return '0.00';
    return v.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  var THAI_MONTH_ABBR = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  // data.signedAt arrives as "dd/mm/yyyy HH:MM" (nowTimestamp() in lib/writeoff-store.js, Christian
  // year) — this only reformats that same string for display (Buddhist year + Thai month + "น."),
  // same convention as fmtThaiSignedAt in index.html's main app.
  function fmtThaiSignedAt(dmyHm) {
    var m = /^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})$/.exec(String(dmyHm || ''));
    if (!m) return dmyHm || '';
    var day = parseInt(m[1], 10), month = parseInt(m[2], 10), yearBe = parseInt(m[3], 10) + 543;
    return day + ' ' + (THAI_MONTH_ABBR[month - 1] || m[2]) + ' ' + yearBe + ' ' + m[4] + ':' + m[5] + ' น.';
  }
  function getBatchId() {
    var m = /[?&]batch=([^&]+)/.exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }

  var app = document.getElementById('app');
  var batchId = getBatchId();
  var lastData = null;

  function renderError(msg) {
    app.innerHTML = '<div class="error-box">⚠️ ' + esc(msg) + '</div>';
  }

  function renderDoc(data) {
    lastData = data;
    var meta = STATUS_META[data.status] || STATUS_META.pending;
    var itemsHtml = data.items.map(function (it) {
      return '<tr><td>' + esc(it.customerName) + ' · ' + esc(it.soDisplay) + '</td>' +
        '<td>' + esc(it.overdueCount) + ' งวด</td>' +
        '<td style="text-align:right; font-weight:700;">฿' + esc(it.amountDisp) + '</td></tr>';
    }).join('');

    var actionsHtml = '';
    if (data.status === 'pending') {
      actionsHtml =
        '<div class="name-field"><label>ชื่อผู้พิจารณา</label><input type="text" id="actorName" placeholder="พิมพ์ชื่อของท่าน" /></div>' +
        '<div class="btn-row">' +
          '<button class="act approve" id="btnApprove">✓ อนุมัติ</button>' +
          '<button class="act reject" id="btnReject">✗ ไม่อนุมัติ</button>' +
          '<button class="act hold" id="btnHold">⏳ รอพิจารณา</button>' +
        '</div>' +
        '<div class="reason-box" id="reasonBox" style="display:none;"><textarea id="reasonText" placeholder="เหตุผลที่ไม่อนุมัติ (จำเป็นต้องระบุ)"></textarea>' +
          '<div class="btn-row" style="margin-top:8px;"><button class="act reject" id="btnConfirmReject">ยืนยันไม่อนุมัติ</button></div></div>';
    } else if (data.status === 'approved') {
      actionsHtml =
        '<div class="result-note good" style="margin-bottom:14px;">อนุมัติแล้วโดย ' + esc(data.approver) + (data.decidedAt ? ' · ' + esc(data.decidedAt) : '') + '</div>' +
        '<div class="name-field"><label>ชื่อผู้เซ็น (ยืนยันแทนลายเซ็น)</label><input type="text" id="signerName" placeholder="พิมพ์ชื่อของท่าน" value="' + esc(data.approver) + '" /></div>' +
        '<button class="act sign" id="btnSign">✍️ เซ็นออนไลน์</button>';
    } else if (data.status === 'rejected') {
      actionsHtml = '<div class="result-note bad">ไม่อนุมัติ' + (data.reason ? ' — เหตุผล: ' + esc(data.reason) : '') + '</div>';
    } else if (data.status === 'signed') {
      actionsHtml = '<div class="result-note good">เซ็นเสร็จสมบูรณ์โดย ' + esc(data.signedBy) +
        '<br>ตัดจำหน่ายหนี้สูญตามเอกสารนี้เรียบร้อยแล้ว' +
        (data.signedAt ? '<div style="margin-top:6px; font-size:12px; opacity:0.75;">ลงนามเมื่อ: ' + esc(fmtThaiSignedAt(data.signedAt)) + '</div>' : '') +
        '</div>';
    }

    app.innerHTML =
      '<div class="doc-title">หนังสืออนุมัติตัดจำหน่ายหนี้สูญ</div>' +
      '<div class="doc-id">เลขที่เอกสาร: ' + esc(data.docNo || data.batchId) + '</div>' +
      '<div style="text-align:center;"><span class="status-badge" style="background:' + meta.bg + '; color:' + meta.color + ';">' + meta.label + '</span></div>' +
      '<div class="meta-row"><span>เสนอโดย</span><b>' + esc(data.submittedBy) + '</b></div>' +
      '<div class="meta-row"><span>วันที่เสนอ</span><b>' + esc(data.submittedAt) + '</b></div>' +
      '<div class="meta-row" style="border-bottom:none;"><span>จำนวนรายการ</span><b>' + data.items.length + ' ราย</b></div>' +
      '<table class="items"><thead><tr><th>ลูกหนี้</th><th>ค้างมาแล้ว</th><th>ยอด</th></tr></thead><tbody>' + itemsHtml + '</tbody></table>' +
      '<div class="total-row">รวม ฿' + esc(fmtMoney(data.totalAmountRaw)) + '</div>' +
      (data.pdfLink ? '<a class="pdf-link" href="' + esc(data.pdfLink) + '" target="_blank" rel="noopener">📄 เปิดดูเอกสาร PDF ต้นฉบับ</a>' : '') +
      '<div style="margin-top:18px; padding-top:18px; border-top:1px solid rgba(247,130,59,0.12);">' + actionsHtml + '</div>';

    wireActions();
  }

  function setBusy(busy) {
    var btns = app.querySelectorAll('button');
    btns.forEach(function (b) { b.disabled = busy; });
  }

  function submitDecision(decision, reason) {
    var nameInput = document.getElementById('actorName') || document.getElementById('signerName');
    var actorName = nameInput ? nameInput.value.trim() : '';
    if ((decision === 'approve' || decision === 'sign') && !actorName) {
      window.alert('กรุณาพิมพ์ชื่อของท่านก่อน');
      return;
    }
    setBusy(true);
    fetch('/api/writeoff-action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ batch: batchId, decision: decision, reason: reason || '', actorName: actorName })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) throw new Error((r.data && r.data.error) || 'ดำเนินการไม่สำเร็จ');
        return loadDoc();
      })
      .catch(function (err) {
        setBusy(false);
        window.alert('ดำเนินการไม่สำเร็จ: ' + err.message);
      });
  }

  function wireActions() {
    var btnApprove = document.getElementById('btnApprove');
    var btnReject = document.getElementById('btnReject');
    var btnHold = document.getElementById('btnHold');
    var btnConfirmReject = document.getElementById('btnConfirmReject');
    var btnSign = document.getElementById('btnSign');
    if (btnApprove) btnApprove.onclick = function () {
      if (window.confirm('ยืนยันอนุมัติตัดจำหน่ายหนี้สูญ ' + lastData.items.length + ' ราย รวม ฿' + fmtMoney(lastData.totalAmountRaw) + ' ?')) submitDecision('approve');
    };
    if (btnHold) btnHold.onclick = function () { submitDecision('hold'); };
    if (btnReject) btnReject.onclick = function () {
      document.getElementById('reasonBox').style.display = 'block';
      document.getElementById('reasonText').focus();
    };
    if (btnConfirmReject) btnConfirmReject.onclick = function () {
      var reason = document.getElementById('reasonText').value.trim();
      if (!reason) { window.alert('กรุณาระบุเหตุผลที่ไม่อนุมัติ'); return; }
      submitDecision('reject', reason);
    };
    if (btnSign) btnSign.onclick = function () {
      if (window.confirm('ยืนยันเซ็นเอกสารตัดจำหน่ายหนี้สูญนี้? การกระทำนี้เป็นขั้นตอนสุดท้าย')) submitDecision('sign');
    };
  }

  function loadDoc() {
    return fetch('/api/writeoff-view?batch=' + encodeURIComponent(batchId))
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) throw new Error((r.data && r.data.error) || 'โหลดเอกสารไม่สำเร็จ');
        renderDoc(r.data);
      })
      .catch(function (err) { renderError(err.message); });
  }

  if (!batchId) {
    renderError('ลิงก์ไม่ถูกต้อง — ไม่มีเลขที่เอกสาร');
  } else {
    loadDoc();
  }
})();
</script>
</body>
</html>
