<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>การโทรติดตามหนี้ (ทดสอบ)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --o1:#f7823b; --o2:#f0630f; --ink:#212529; --mute:#6b7280; --line:rgba(247,130,59,.14); --red:#e03131; --green:#12b886; --amber:#f08c00; --blue:#339af0; --violet:#7048e8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Sarabun','Prompt',sans-serif; color:var(--ink); background:linear-gradient(160deg,#f7f8f9 0%,#f1f2f4 45%,#f7f8f9 100%); min-height:100vh; }
  h1,h2,h3,.pf { font-family:'Prompt',sans-serif; }
  .app { display:flex; min-height:100vh; }
  .side { width:230px; flex-shrink:0; background:rgba(255,255,255,.97); border-right:1px solid var(--line); padding:20px 14px; position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto; }
  .logo { display:flex; gap:10px; align-items:center; padding:2px 2px 18px; }
  .logo i { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--o1),var(--o2)); display:inline-block; box-shadow:0 6px 16px rgba(247,130,59,.35); }
  .logo b { font-family:'Prompt'; font-size:13.5px; line-height:1.3; }
  .nav { display:flex; flex-direction:column; gap:4px; }
  .nav div { padding:10px 12px; border-radius:10px; font-size:13.5px; color:var(--mute); font-weight:600; cursor:default; }
  .nav div.on { background:rgba(247,130,59,.12); color:var(--o1); }
  .nav div.dim { opacity:.55; }
  .main { flex:1; min-width:0; }
  .top { position:sticky; top:0; z-index:5; background:rgba(255,255,255,.97); border-bottom:1px solid var(--line); padding:10px 24px; display:flex; gap:12px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
  .proto { background:#fff4e6; color:#c2650a; border:1px dashed #f0a35c; border-radius:10px; padding:5px 12px; font-size:12px; font-weight:600; margin-right:auto; }
  .wrap { padding:26px 28px 80px; max-width:1500px; margin:0 auto; }
  .card { background:rgba(255,255,255,.97); border:1px solid rgba(255,255,255,.85); border-radius:20px; padding:22px 24px; margin-bottom:20px; box-shadow:0 8px 26px rgba(247,130,59,.08); }
  .card h3 { margin:0 0 14px; font-size:15px; font-weight:600; }
  select,input[type=text],input[type=number],input[type=date] { font-family:inherit; padding:9px 11px; border-radius:10px; border:1px solid rgba(247,130,59,.25); background:#fff; font-size:13.5px; color:var(--ink); outline:none; }
  select:focus,input:focus { border-color:var(--o1); }
  button { font-family:inherit; cursor:pointer; }
  .btn { border:none; background:linear-gradient(135deg,var(--o1),var(--o2)); color:#fff; padding:9px 16px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:0 5px 14px rgba(247,130,59,.28); }
  .btn.ghost { background:#fff; color:var(--mute); border:1px solid rgba(247,130,59,.25); box-shadow:none; }
  .btn.sm { padding:6px 11px; font-size:12px; border-radius:9px; }
  .btn.green { background:linear-gradient(135deg,#20c997,#12b886); box-shadow:0 5px 14px rgba(18,184,134,.28); }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .tab { padding:9px 18px; border-radius:12px; font-size:13.5px; font-weight:600; background:#fff; color:var(--mute); border:1px solid rgba(247,130,59,.25); cursor:pointer; display:flex; gap:8px; align-items:center; }
  .tab.on { background:linear-gradient(135deg,var(--o1),var(--o2)); color:#fff; border-color:transparent; box-shadow:0 6px 16px rgba(247,130,59,.3); }
  .tab .n { background:rgba(0,0,0,.08); border-radius:20px; padding:1px 8px; font-size:11.5px; }
  .tab.on .n { background:rgba(255,255,255,.3); }
  .tab.sub { padding:8px 14px; font-size:13px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:20px; }
  .kpi { background:#fff; border-radius:16px; border:1px solid var(--line); border-left:4px solid var(--c,#f36916); padding:14px 16px; box-shadow:0 2px 8px rgba(0,0,0,.04); }
  .kpi small { color:var(--mute); font-size:12px; } .kpi b { display:block; font-family:'Prompt'; font-size:21px; color:var(--c,#f36916); margin-top:4px; } .kpi span { font-size:11.5px; color:#8d93a0; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; padding:11px 9px; color:var(--o1); font-weight:700; font-size:12px; white-space:nowrap; border-bottom:1px solid var(--line); }
  td { padding:11px 9px; border-bottom:1px solid rgba(0,0,0,.05); vertical-align:middle; }
  tbody tr.click { cursor:pointer; } tbody tr.click:hover { background:rgba(247,130,59,.05); }
  .code { color:var(--o2); font-weight:700; white-space:nowrap; }
  .pill { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .p-red { background:rgba(224,49,49,.1); color:var(--red); } .p-green { background:rgba(18,184,134,.12); color:#0b7a5b; } .p-amber { background:rgba(240,140,0,.12); color:#c2650a; } .p-gray { background:#f1f3f5; color:var(--mute); } .p-blue { background:rgba(51,154,240,.12); color:#1c7ed6; } .p-violet { background:rgba(112,72,232,.12); color:var(--violet); }
  .bars { display:flex; align-items:flex-end; gap:18px; min-height:230px; padding:6px 6px 0; }
  .bar { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:230px; cursor:pointer; }
  .bar .v { font-size:11.5px; font-weight:700; color:#495057; margin-bottom:5px; white-space:nowrap; }
  .bar .col { position:relative; width:100%; max-width:64px; }
  .bar .col::before { content:''; position:absolute; top:-8px; left:6px; right:-6px; bottom:0; background:#ffa8a8; opacity:.45; border-radius:999px; }
  .bar .col i { position:absolute; inset:0 6px 0 0; border-radius:999px; background:linear-gradient(180deg,#ff8787,#e03131); box-shadow:0 5px 10px rgba(224,49,49,.25); }
  .bar.on .col i { background:linear-gradient(180deg,#f7823b,#d9480f); }
  .bar .l { font-size:12px; color:var(--mute); font-weight:600; margin-top:9px; white-space:nowrap; } .bar .c { font-size:11px; color:#8d93a0; }
  .bar:hover .l { color:var(--o1); }
  .mask { position:fixed; inset:0; z-index:50; background:rgba(33,37,41,.4); display:flex; align-items:flex-start; justify-content:center; padding:26px 16px; overflow-y:auto; }
  .modal { background:#fff; border-radius:22px; width:100%; max-width:1180px; padding:24px 26px; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  .mh { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:16px; }
  .cols { display:grid; grid-template-columns:minmax(300px,420px) 1fr; gap:22px; }
  @media (max-width:980px) { .cols { grid-template-columns:1fr; } .side { display:none; } }
  .box { border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:14px; background:rgba(247,130,59,.025); }
  .box h4 { margin:0 0 10px; font-size:13.5px; font-family:'Prompt'; }
  .instrow { display:flex; gap:9px; align-items:flex-start; padding:7px 0; border-bottom:1px dashed rgba(0,0,0,.08); font-size:12.5px; }
  .field { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; min-width:0; } .field input, .field select { width:100%; min-width:0; max-width:100%; } .field label { font-size:12px; color:var(--mute); font-weight:600; }
  .hist { background:rgba(243,105,22,.05); border:1px solid rgba(243,105,22,.12); border-radius:10px; padding:8px 10px; font-size:12px; margin-bottom:7px; }
  .note { font-size:11.5px; color:#495057; line-height:1.5; } .note div { padding:2px 0; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#212529; color:#fff; padding:11px 20px; border-radius:12px; font-size:13px; z-index:99; box-shadow:0 8px 24px rgba(0,0,0,.3); }
  .grid12 { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; }
  .muted { color:var(--mute); font-size:12px; } .right { text-align:right; } .nowrap { white-space:nowrap; }
  .progress { height:8px; border-radius:8px; background:rgba(0,0,0,.07); overflow:hidden; } .progress i { display:block; height:100%; border-radius:8px; background:linear-gradient(90deg,#f7823b,#12b886); }
  .rule { font-size:12.5px; color:#495057; line-height:1.8; }
  /* ฝังในระบบติดตามหนี้ (iframe): ซ่อนเมนูข้างจำลองของต้นแบบ */
  html.embedded .side { display:none; }
  html.embedded .top { position:static; }
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><i></i><b>ระบบติดตามหนี้<br>และผ่อนชำระ</b></div>
    <div class="nav">
      <div class="dim">Dashboard</div><div class="dim">ติดตามหนี้</div><div class="dim">การแจ้งเตือน</div>
      <div class="on">📞 การโทรติดตามหนี้</div>
      <div class="dim">Easy Restart</div><div class="dim">ดำเนินคดีทางกฎหมาย</div><div class="dim">สำหรับผู้บริหาร</div><div class="dim">Easy Phone Easy Cash</div><div class="dim">Report</div>
    </div>
  </aside>
  <div class="main">
    <div class="top">
      <div class="proto">ต้นแบบ HTML — ข้อมูลตัวอย่าง ยังไม่เชื่อมระบบจริง (บันทึกในเบราว์เซอร์นี้เท่านั้น)</div>
      <span class="muted">จำลองผู้ใช้:</span>
      <select id="userSel" data-bind="user"></select>
      <button class="btn ghost sm" data-act="reset">↺ รีเซ็ตข้อมูลตัวอย่าง</button>
    </div>
    <div class="wrap" id="root"></div>
  </div>
</div>
<div id="modalHost"></div>
<div id="xferHost"></div>

<script>
/* ============================================================
   ต้นแบบเมนู "การโทรติดตามหนี้"  — ข้อมูลทั้งหมดเป็นตัวอย่าง
   ============================================================ */
const STAFF = ['สมชาย ใจดี', 'วรรณา สุขใจ', 'อนุชา มั่งมี'];
const ADMIN = 'พิมพ์ชนก (Admin)';
const CALL_RESULTS = [   // ชุดเดียวกับเมนูติดตามหนี้ในระบบจริง
  { key:'reschedule', label:'ติดต่อได้ - ขอเลื่อน', needDate:true },
  { key:'cancel', label:'ติดต่อได้ - ขอยกเลิกคืนเครื่อง' },
  { key:'busy', label:'ติดต่อไม่ได้ - สายไม่ว่าง' },
  { key:'unreachable', label:'ติดต่อไม่ได้ - ปิดเครื่อง/เบอร์ผิด' },
  { key:'no_answer', label:'ติดต่อไม่ได้ - ไม่รับสาย' },
  { key:'voicemail', label:'ฝากข้อความ' }
];
const RES = Object.fromEntries(CALL_RESULTS.map(r => [r.key, r]));
// กติกาโทรซ้ำ: จำนวนวันหลังโทรที่ต้องติดตามซ้ำ (reschedule ใช้วันที่ที่ลูกค้านัด)
const RECALL_DAYS = { busy:1, no_answer:1, voicemail:1, unreachable:2, cancel:3 };
const BUCKETS = [   // ช่วงอายุตามตาราง "เงื่อนไขการระยะเวลาการติดตามหนี้"
  { key:'b1', label:'16-50 วัน', min:16, max:50, stage:'St2 · เฝ้าระวัง', act:'ล็อคเครื่อง (Marena) + โทรติดตามจนกว่าจะรับสาย/ชำระเงิน' },
  { key:'b2', label:'51-60 วัน', min:51, max:60, stage:'St2 · เฝ้าระวัง', act:'เจรจาปรับโครงสร้างหนี้' },
  { key:'b3', label:'61-90 วัน', min:61, max:90, stage:'St3 · หนี้เสีย', act:'ให้บริษัทติดตามหนี้ทำงาน (ส่งต่องานนอก)' },
  { key:'b4', label:'91-120 วัน', min:91, max:120, stage:'St3 · หนี้เสีย', act:'ดำเนินคดี (ส่งกฎหมาย)' },
  { key:'b5', label:'เกิน 120 วัน', min:121, max:99999, stage:'St3 · NPL 120+', act:'NPL 120+ (หนี้ที่ไม่ก่อให้เกิดรายได้)' }
];
const DUE_DAYS = [1, 5, 15, 25, 30];   // วันครบกำหนดชำระของสัญญา (ทุกเดือน)
// รอบตัดยอดลูกหนี้เข้าเมนูโทรติดตาม: ระบบดึงยอดเวลา 00:00 น. ของวันโทร (= วันตัดยอด + 1) โดยใช้ยอดค้าง ณ สิ้นวันตัดยอด
const CUT_RULES = {
  1:  { cut:15, next:false, label:'ทุกวันที่ 15',                  call:'วันที่ 16' },
  5:  { cut:20, next:false, label:'ทุกวันที่ 20',                  call:'วันที่ 21' },
  15: { cut:29, next:false, label:'ทุกวันที่ 29',                  call:'วันที่ 30' },
  25: { cut:10, next:true,  label:'ทุกวันที่ 10 ของเดือนถัดไป',    call:'วันที่ 11 ของเดือนถัดไป' },
  30: { cut:15, next:true,  label:'ทุกวันที่ 15 ของเดือนถัดไป',    call:'วันที่ 16 ของเดือนถัดไป' }
};
const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

/* ---------- วันที่/ตัวเลข ---------- */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const p = s.slice(0,10).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const diffDays = (a,b) => Math.round((parse(a)-parse(b))/86400000);
const TODAY_ISO = iso(TODAY);
const fmtD = s => s ? s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4) : '-';
const fmtDT = s => fmtD(s)+' '+(s.slice(11,16)||'');
const money = n => Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nowStamp = () => { const n = new Date(); return iso(n)+'T'+pad(n.getHours())+':'+pad(n.getMinutes()); };

/* ---------- ข้อมูลตัวอย่าง ---------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
const cleanLabel = k => 'โทร' + RES[k].label.replace(/\s*-\s*/g,'-');

function dueOn(base, k, dd){   // วันที่ dd ของเดือน (base + k เดือน) ถ้าเดือนนั้นไม่มีวันที่ dd ใช้วันสุดท้ายของเดือน
  const first = new Date(base.getFullYear(), base.getMonth() + k, 1), last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return new Date(first.getFullYear(), first.getMonth(), Math.min(dd, last));
}
function seedRows(){
  const R = rng(20261113);
  const names = ['อัมรินทร์ นุ่มปั้น','ณวพงษ์ ทาเอื้อ','ฐิติมา ภูมิพื้นผล','กุสุมา กูลธรรม','ธราเทพ จันทร์ทองสุข','สุพลชัย ยาแก้ว','ยุพารัตน์ สาระพันธ์','อรวรรณ ปุยอ่อน','อรุณี เดชปั้น','สรยุทธ โชติสนธิ์','พิมพ์ลดา แสนดี','วิชัย ศรีสุข','นภาพร มีทรัพย์','ปรเมศวร์ ทองคำ','จิราภรณ์ บุญมา','ธนากร สายบุญ','เกศินี วงศ์ไทย','ชัยวัฒน์ คำแก้ว','สุภาพร ใจเย็น','มานพ ปัญญาดี','รัตนา เพชรงาม','ภูมิพัฒน์ อินทร์แก้ว','ศิริพร นามสกุล','เอกชัย ทองดี','ลลิตา สุขสันต์','วีรพล ชัยมงคล','กัญญา รุ่งเรือง','ประเสริฐ แก้วใส'];
  const ages = [18,22,27,35,41,48,52,58,63,70,78,86,89,95,105,110,118,125,140,20,30,45,55,66,10,6,14,12];
  const rows = names.map((nm,i) => {
    const total = 12, amt = Math.round((1500 + R()*4000)/10)*10;
    const age = ages[i];
    const k = Math.max(1, Math.min(4, Math.floor(age/30)+1 + (R()>.6?1:0)));
    const firstOverdueNo = 3 + Math.floor(R()*4);
    const insts = [], dd = DUE_DAYS[i % DUE_DAYS.length];
    let d0 = addDays(TODAY, -age); while (dueOn(d0, 0, dd).getTime() > d0.getTime()) d0 = addDays(d0, -1);   // งวดที่ค้างเก่าสุด = วันครบกำหนด dd ล่าสุดก่อนหน้าอายุหนี้ที่ตั้งไว้
    const dueBase = dueOn(d0, 0, dd);
    for (let n=1; n<=total; n++) {
      const due = dueOn(dueBase, n - firstOverdueNo, dd);
      const di = iso(due);
      const overdue = n >= firstOverdueNo && n < firstOverdueNo + k && di < TODAY_ISO;
      const paidFull = n < firstOverdueNo;
      insts.push({ no:n, due:di, amt, paid: paidFull?amt:0, paidDate: paidFull?di:'', chase: overdue, notes:[], lock: i%5===0 ? 'cannot' : i%4===1 ? 'manual' : 'system' });
    }
    return { id:'CUS-2025'+String(100000+Math.floor(R()*899999)), name:nm, so:'SO-2026'+String(10000000+Math.floor(R()*8999999)), phone:'08'+String(10000000+Math.floor(R()*89999999)), insts, dueDay:dd, calls:[], payments:[], owner:null, ownerLog:[] };
  });
  rows.forEach(r => { if (!r.insts.some(i=>i.chase)) { const x = r.insts.find(i=>i.due<TODAY_ISO && !i.paid); if (x) x.chase = true; } });
  // ประวัติการโทรตัวอย่าง (ให้เห็นแจ้งเตือนติดตามซ้ำ)
  const seedCalls = [
    [0,'busy',1,0],[1,'reschedule',3,-1,'ขอเลื่อนเพราะรอเงินเดือนออก'],[2,'no_answer',2,1],[3,'unreachable',4,2],[4,'reschedule',5,-2,'ขอเลื่อนเพราะรอเงินเดือน'],
    [5,'reschedule',6,-3],[6,'cancel',5,0,'ไม่สะดวกผ่อนต่อ ขอคืนเครื่อง'],[7,'voicemail',1,1],[8,'cancel',4,2,'ขอคืนเครื่อง รอฝ่ายสัญญาติดต่อกลับ'],[9,'reschedule',2,2],[10,'busy',0,0],[12,'no_answer',3,1],[14,'reschedule',7,-4],[16,'busy',2,2],[18,'reschedule',3,-1],[17,'reschedule',3,-1,'นัดชำระตามเงื่อนไขขอเลื่อน']
  ];
  seedCalls.forEach(([idx,res,agoDays,ptpOffset,note]) => {
    const r = rows[idx]; const at = iso(addDays(TODAY,-agoDays))+'T'+pad(9+idx%8)+':'+pad(10+idx*3%50);
    const e = { at, by:STAFF[idx%3], result:res, note:note||'' };
    if (RES[res].needDate) { e.ptpDate = iso(addDays(parse(at), Math.max(1, agoDays + ptpOffset))); e.ptpAmt = Math.round(rowSnap(r)/2); }

  applyPayment(rows[13], 2000, afterCut(rows[13], 1), STAFF[1]);

  const early = rows[20], epd = afterCut(early, 2); applyPayment(early, rowRemain(early), epd, STAFF[2]);   // ชำระก่อนมีการโทร: โทรครั้งแรกหลังวันที่ชำระ

}

/* ---------- ตรรกะหลัก ---------- */
const rem = i => Math.max(0, i.amt - i.paid);
function cutoffFor(dd, y, m){   // วันตัดยอดของรอบที่ "วันครบกำหนด" อยู่ในเดือน m (เดือนสั้นใช้วันสุดท้ายของเดือน)

}
function lastCutoff(dd){   // รอบตัดยอดล่าสุดที่ถูกดึงเข้าเมนูแล้ว (วันตัดยอดต้องผ่านมาแล้ว เพราะดึงตอน 00:00 ของวันถัดไป)

  return best;
}
const paidAsOf = (i, c) => i.pays ? i.pays.filter(x => x.date <= c).reduce((a,x) => a + x.amt, 0) : (i.paidDate && i.paidDate <= c ? i.paid : 0);

  if (!c) return { cut:null, call:null, items:[], total:0, paid:0 };
  const ci = iso(c), items = [];
  r.insts.forEach(i => { if (i.due <= ci) { const was = paidAsOf(i, ci), out = i.amt - was; if (out > .005) items.push({ i, out, since:Math.max(0, i.paid - was) }); } });

function payTiming(r){   // แยกยอดที่ลูกค้าชำระ "ก่อน" / "หลัง" การโทรติดตามครั้งแรก — ใช้ตัดสินยอดที่นับค่าคอมมิชชั่น

  for (let i=1;i<=nos.length;i++){ if (nos[i]===p+1) { p = nos[i]; continue; } parts.push(s===p ? ''+s : s+'-'+p); s = nos[i]; p = nos[i]; }

function applyPayment(r, amount, dateIso, by){                                      // ข้อ 7: อัปเดตยอดที่ชำระ/วันที่ชำระ
  let left = amount; const done = [];
  unpaid(r).sort((a,b)=>a.due.localeCompare(b.due)).forEach(i => {
    if (left <= 0) return; const take = Math.min(left, rem(i)); if (!i.pays) i.pays = i.paid > 0 && i.paidDate ? [{ date:i.paidDate, amt:i.paid }] : [];
    i.pays.push({ date:dateIso, amt:take });
    i.paid += take; i.paidDate = dateIso; left -= take; done.push(i.no);
    if (i.waived && !i.waiveLogged) { i.waiveLogged = true; i.notes.unshift('ลูกค้ากลับมาชำระ (' + fmtD(dateIso) + ') — ไม่เก็บค่าปรับชำระล่าช้า/ค่าธรรมเนียมระบบ ในงวดนี้ (ค้างเกิน 3 งวด)'); }

/* ---------- แท็บ: รายการโทรติดตาม ---------- */
function viewWork(alerts){
  const active = S.rows.filter(r => rowSnap(r) > .005 && rowRemain(r) > .005);   // ลูกค้าที่ถูกดึงยอดเข้าเมนูแล้ว และยังชำระไม่ครบ
  const belowN = S.rows.filter(r => rowSnap(r) <= .005 && r.insts.some(i => i.due < TODAY_ISO && rem(i) > .005)).length;   // ค้างชำระแต่ยังไม่ถึงรอบตัดยอด
  const per = BUCKETS.map(b => { const rs = active.filter(r => bucketOf(rowAge(r)) === b.key); return { ...b, rows:rs, amt:rs.reduce((s,r)=>s+rowSnap(r),0) }; });
  const maxAmt = Math.max(1, ...per.map(p=>p.amt));
  const paidRows = S.rows.filter(r => rowSnap(r) > .005 && rowRemain(r) <= .005);
  const total = per.reduce((s,p)=>s+p.amt,0);
  const callsToday = S.rows.reduce((s,r)=>s+r.calls.filter(c=>c.at.slice(0,10)===TODAY_ISO).length,0);
  const unowned = active.filter(r => !r.owner);
  const mine = active.filter(r => r.owner === S.user);
  let h = `<div class="kpis">
    <div class="kpi" style="--c:#e03131"><small>ยอดค้างชำระรวม</small><b>฿${money(total)}</b><span>${active.length} ราย</span></div>
    <div class="kpi" style="--c:#f08c00;cursor:pointer" data-act="bucket" data-v="unowned"><small>ยังไม่มีผู้รับผิดชอบ</small><b>${unowned.length} ราย</b><span>คลิกเพื่อดู แล้วไปรับเป็นของตัวเอง</span></div>
    <div class="kpi" style="--c:#339af0"><small>โทรแล้ววันนี้</small><b>${callsToday} ครั้ง</b><span>ทุกพนักงาน</span></div>
    <div class="kpi" style="--c:#7048e8;cursor:pointer" data-act="tab" data-v="alert"><small>ต้องติดตามซ้ำ</small><b>${alerts.length} ราย</b><span>คลิกเพื่อดูรายการ</span></div>
    <div class="kpi" style="--c:#12b886"><small>ลูกค้าชำระหลังโทร</small><b>${paidRows.length} ราย</b><span>ชำระครบแล้ว</span></div></div>`;
  h += `<div class="card"><h3>ยอดค้างชำระ แบ่งตามอายุลูกหนี้ (นับจากวันครบกำหนดของงวดที่ค้างเก่าสุด)</h3><div class="bars">` +
    per.map(p => { const px = Math.max(6, p.amt / maxAmt * 150); return `<div class="bar" style="cursor:default"><div class="v">฿${Math.round(p.amt).toLocaleString('th-TH')}</div><div class="col" style="height:${px}px"><i></i></div><div class="l">${p.label}</div><div class="c">${p.rows.length} ราย</div><div class="c" style="color:${p.stage.startsWith('St2')?'#c2650a':'#e03131'};font-weight:600">${p.stage}</div></div>`; }).join('') +
    `</div></div>`;
  h += `<div class="card" style="padding:16px 20px;background:#fff8e6"><b>รอบตัดยอดลูกหนี้เข้าเมนูโทรติดตาม</b> <span class="muted">— ระบบดึงยอดค้างชำระอัตโนมัติ เวลา 00:00 น. ของวันโทร (ใช้ยอดค้าง ณ สิ้นวันตัดยอด)</span>
    <div style="overflow-x:auto;margin:10px 0"><table style="font-size:12.5px;background:#fff;border-radius:10px"><thead><tr><th>วันครบกำหนดชำระ</th><th>ตัดยอด</th><th>เริ่มโทรติดตาม</th><th>รอบล่าสุดที่ดึงแล้ว (วันตัดยอด)</th><th>ลูกค้าในรอบ</th></tr></thead><tbody>` +
    DUE_DAYS.map(d => { const lc = lastCutoff(d); return `<tr><td><b>ทุกวันที่ ${d}</b></td><td>${CUT_RULES[d].label}</td><td>${CUT_RULES[d].call}</td><td>${lc ? fmtD(iso(lc)) : '-'}</td><td>${active.filter(r => r.dueDay === d).length} ราย</td></tr>`; }).join('') + `</tbody></table></div>
    <div class="rule">• <b>ยอดที่ดึงมาจะแสดงคงเดิม</b> แม้ลูกค้าชำระหลังดึงยอด — ระบบแสดงยอดที่ชำระหลังตัดรอบแยกไว้ในคอลัมน์ "ยอดที่ชำระ" · <b>รอบถัดไปยอดค้างบวกสะสม</b> (ยอดค้างเดิมที่ยังไม่ชำระ + งวดใหม่ที่ครบกำหนด) · ลูกค้าที่ค้างแต่ยังไม่ถึงรอบตัดยอด (${belowN} ราย) ยังอยู่ในขั้น SMS/จดหมาย/ล็อคเครื่อง จึงไม่แสดงในรายการนี้<br>• <b>ลูกค้าถูกล็อกเป็นของพนักงานคนแรกที่บันทึกการโทร</b> หรือพนักงานที่เลือกรับเองในช่อง "พนักงานที่ติดตาม" — คนอื่นโทรแทนไม่ได้ ยอดชำระนับให้ผู้รับผิดชอบ (Admin โอนได้)</div></div>`;
  const tabsDef = [['all','ทั้งหมด',active.length], ['unowned','ยังไม่มีผู้รับผิดชอบ',unowned.length]];
  if (STAFF.indexOf(S.user) !== -1) tabsDef.push(['mine','ลูกค้าของฉัน',mine.length]);
  tabsDef.push(['due','วันครบกำหนดชำระ',active.length]);
  if (isAdmin()) tabsDef.push(['paid','✅ ชำระแล้ว',paidRows.length]);   // แท็บชำระแล้ว เห็นเฉพาะ Admin
  if (!tabsDef.some(t => t[0] === UI.bucket)) UI.bucket = 'all';
  h += `<div class="tabs">` + tabsDef.map(t => `<div class="tab sub ${UI.bucket===t[0]?'on':''}" data-act="bucket" data-v="${t[0]}">${t[1]} <span class="n">${t[2]}</span></div>`).join('') + `</div>`;
  let rows = UI.bucket === 'paid' ? paidRows : UI.bucket === 'unowned' ? unowned : UI.bucket === 'mine' ? mine : active;
  if (UI.bucket === 'due' || UI.bucket === 'mine') {   // แท็บย่อย: วันครบกำหนดชำระ (ใช้ได้ทั้งในแท็บวันครบกำหนดชำระและลูกค้าของฉัน)
    const sumOf = rs => rs.reduce((a, r) => a + rowSnap(r), 0);
    const dsub = [['all','ทุกวัน',rows.length,sumOf(rows)], ...DUE_DAYS.map(d => { const rs = rows.filter(r => dueGroup(r) === d); return [String(d), 'ทุกวันที่ ' + d, rs.length, sumOf(rs)]; })];
    const showAmt = UI.bucket === 'due';   // แท็บวันครบกำหนดชำระ: แสดงยอดค้างชำระรวมของแต่ละวันครบกำหนด
    if (showAmt) {   // แท็บวันครบกำหนดชำระ: การ์ดสรุปรายวันครบกำหนด (ยอดค้าง · จำนวนราย · สัดส่วน)
      const totAmt = Math.max(1, dsub[0][3]);
      h += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px">` + dsub.map(t => {
        const on = String(UI.dueDay) === t[0], pct = t[0] === 'all' ? 100 : t[3] / totAmt * 100;
        return `<div data-act="dueDay" data-v="${t[0]}" style="cursor:pointer;border-radius:16px;padding:14px 16px;border:1px solid ${on?'transparent':'var(--line)'};background:${on?'linear-gradient(135deg,var(--o1),var(--o2))':'#fff'};color:${on?'#fff':'var(--ink)'};box-shadow:${on?'0 8px 20px rgba(247,130,59,.35)':'0 2px 8px rgba(0,0,0,.04)'}">
          <div style="font-size:12.5px;font-weight:600;opacity:${on?.95:.7}">${t[0]==='all'?'ทุกวันครบกำหนด':t[1]}</div>
          <div class="pf" style="font-size:20px;font-weight:700;margin:6px 0 2px;color:${on?'#fff':'#e03131'}">฿${money(t[3])}</div>
          <div style="font-size:12px;opacity:${on?.95:.7}">${t[2]} ราย${t[0]==='all'?'':' · '+pct.toFixed(1)+'% ของยอดรวม'}</div>
          <div style="height:5px;border-radius:5px;background:${on?'rgba(255,255,255,.35)':'rgba(0,0,0,.07)'};margin-top:8px;overflow:hidden"><i style="display:block;height:100%;width:${pct}%;border-radius:5px;background:${on?'#fff':'linear-gradient(90deg,#f7823b,#e03131)'}"></i></div></div>`;
      }).join('') + `</div>`;
    } else
    h += `<div class="tabs" style="margin-top:-6px"><span class="muted" style="align-self:center">วันครบกำหนดชำระ:</span>` + dsub.map(t => `<div class="tab sub ${String(UI.dueDay)===t[0]?'on':''}" data-act="dueDay" data-v="${t[0]}"${showAmt?' style="flex-direction:column;gap:2px;align-items:flex-start"':''}><span style="display:flex;gap:8px;align-items:center">${t[1]} <span class="n">${t[2]}</span></span>${showAmt?`<span style="font-size:12px;font-weight:700;opacity:.9">฿${money(t[3])}</span>`:''}</div>`).join('') + `</div>`;
    if (UI.dueDay !== 'all') rows = rows.filter(r => String(dueGroup(r)) === String(UI.dueDay));
  }
  const q = UI.q.trim().toLowerCase();
  if (q) rows = rows.filter(r => (r.id+r.name+r.so).toLowerCase().indexOf(q) !== -1);
  if (UI.staff !== 'all') rows = rows.filter(r => r.owner === UI.staff);
  rows = rows.slice().sort((a,b) => rowAge(b) - rowAge(a));
  const paidSum = UI.bucket === 'paid' ? rows.reduce((a, r) => { const t = payTiming(r); a.after += t.after; a.before += t.before; return a; }, { after:0, before:0 }) : null;
  h += `<div class="card">${paidSum ? `<div class="rule" style="background:#f1faf6;border-radius:12px;padding:10px 14px;margin-bottom:14px">💰 <b>ยอดที่นับค่าคอมมิชชั่น (ชำระหลังโทร): ฿${money(paidSum.after)}</b> · ยอดที่ลูกค้าชำระก่อนโทร (ไม่นับค่าคอม): ฿${money(paidSum.before)}<br><span class="muted">เกณฑ์: เทียบวันที่ชำระกับวันที่โทรติดตามครั้งแรก — ชำระวันเดียวกับวันที่โทรหรือหลังจากนั้นนับเป็น "หลังโทร"</span></div>` : ''}<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
    <input type="text" id="qBox" data-bind="q" placeholder="ค้นหารหัสลูกค้า, ชื่อ หรือคำสั่งซื้อ" value="${esc(UI.q)}" style="flex:1;min-width:240px">
    <select data-bind="staffF"><option value="all">พนักงานที่ติดตาม: ทั้งหมด</option>${STAFF.map(s=>`<option ${UI.staff===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
    <span class="muted">พบ ${rows.length} รายการ</span></div>
    <div style="overflow-x:auto"><table><thead><tr><th>รหัสลูกค้า</th><th>ชื่อลูกค้า</th><th>คำสั่งซื้อ</th><th>งวดที่ค้าง</th><th>วันครบกำหนด</th><th>อายุลูกหนี้</th><th class="right">ยอดค้างชำระ (ที่ดึงมา)</th><th class="right">ยอดที่ชำระ</th><th>วันที่ชำระ</th><th>สถานะการชำระเงิน</th>${UI.bucket==='paid'?'<th>ชำระก่อน/หลังโทร</th><th class="right">ยอดที่นับค่าคอม</th>':''}<th>พนักงานที่ติดตาม</th><th>บันทึกการโทร</th></tr></thead><tbody>` +
    (rows.length ? rows.map(r => rowHtml(r)).join('') : `<tr><td colspan="${UI.bucket==='paid'?14:12}" style="text-align:center;padding:32px;color:#8d93a0">ไม่พบรายการ</td></tr>`) + `</tbody></table></div></div>`;
  return h;
}
function ownerCell(r){
  const key = r.id + '|' + r.so;
  const admin = isAdmin(), staffUser = STAFF.indexOf(S.user) !== -1;
  const xfs = r.ownerLog.filter(o => o.xfer), xf = xfs[xfs.length-1];
  const xfTxt = xf ? `<div class="muted" style="color:#7048e8;white-space:normal;max-width:210px">🔄 โอนมาจาก ${esc(xf.from)} · ${fmtD(xf.at)}<br>เหตุผล: ${esc(xf.reason||'-')}</div>` : '';
  const last = lastCall(r);
  const sub = last ? `<div class="muted">โทรล่าสุด ${fmtDT(last.at)}${last.by!==r.owner?' · '+esc(last.by):''}</div>` : '';
  const sel = (opts, cur) => `<select data-act="noop" data-bind="owner" data-v="${key}" style="padding:6px 8px;font-size:12.5px;max-width:170px">${opts.map(o => `<option value="${esc(o[0])}" ${o[0]===cur?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  if (admin) return sel([['', 'ยังไม่มีผู้รับผิดชอบ'], ...STAFF.map(x => [x, x])], r.owner || '') + sub;
  if (!r.owner) return (staffUser ? `<div class="pill p-amber" style="margin-bottom:5px">ยังไม่มีผู้รับผิดชอบ</div><br><button class="btn green sm" data-act="claim" data-v="${key}">✋ รับเป็นของฉัน</button>` : '<span class="pill p-amber">ยังไม่มีผู้รับผิดชอบ</span>') + sub + xfTxt;
  const btn = r.owner === S.user ? `<div style="margin-top:5px"><button class="btn ghost sm" data-act="xferOpen" data-v="${key}">🔄 โอนเคส</button></div>` : '';
  return `<b>${esc(r.owner)}</b> <span title="ล็อกแล้ว — เปลี่ยนได้เฉพาะเจ้าของ (โอน) หรือ Admin">🔒</span>${r.owner===S.user?' <span class="pill p-green">ของฉัน</span>':''}${sub}${xfTxt}${btn}`;
}
function rowHtml(r){
  const u = unpaid(r), c = lastCall(r), ra = repeatAlert(r);
  const nos = u.length ? instLabel(u.map(i=>i.no)) : instLabel(chaseInsts(r).map(i=>i.no)) + ' (ชำระครบ)';
  const rm = rowSnap(r), cur = rowRemain(r), pd = rowPaid(r), age = rowAge(r);   // rm = ยอดที่ดึงมา (คงเดิม), cur = คงเหลือปัจจุบัน
  return `<tr class="click" data-act="open" data-v="${r.id}|${r.so}">
    <td class="code">${r.id}</td><td style="font-weight:600;white-space:nowrap">${esc(r.name)}</td><td class="nowrap" style="color:var(--o2);font-weight:600">${r.so}</td>
    <td class="nowrap"><span class="pill p-red" style="${u.length?'':'background:rgba(18,184,134,.12);color:#0b7a5b'}">${nos}</span></td>
    <td class="nowrap">${dueGroup(r) ? 'ทุกวันที่ ' + dueGroup(r) : '-'}</td>
    <td class="nowrap">${u.length ? `<b style="color:${age>90?'#e03131':age>50?'#c2650a':'#495057'}">${age} วัน</b><div class="muted">${stageOf(age)}</div>` : '-'}</td>
    <td class="right nowrap" style="font-weight:700;color:${cur>0?'#e03131':'#12b886'}">฿${money(rm)}${pd>0&&cur>0?`<div class="muted" style="font-weight:400">คงเหลือ ฿${money(cur)}</div>`:''}</td>
    <td class="right nowrap" style="color:${pd>0?'#0b7a5b':'#adb5bd'};font-weight:${pd>0?700:400}">${pd>0?'฿'+money(pd):'-'}</td>
    <td class="nowrap">${fmtD(rowPaidDate(r))}</td>
    <td class="nowrap"><span class="pill ${payStatus(r).cls}">${esc(payStatus(r).label)}</span><div class="muted">ชำระแล้ว ${payStatus(r).sub}</div></td>
    ${UI.bucket==='paid' ? (() => { const t = payTiming(r); return `<td class="nowrap"><span class="pill ${t.cls}">${t.label}</span><div class="muted">โทรครั้งแรก ${t.firstCall?fmtD(t.firstCall):'-'}</div><div class="muted">ชำระล่าสุด ${fmtD(rowPaidDate(r))}</div></td><td class="right nowrap"><b style="color:${t.after>0?'#0b7a5b':'#adb5bd'}">${t.after>0?'฿'+money(t.after):'-'}</b>${t.before>0?`<div class="muted">ก่อนโทร ฿${money(t.before)} (ไม่นับ)</div>`:''}</td>`; })() : ''}
    <td class="nowrap">${ownerCell(r)}</td>
    <td><div style="display:flex;flex-direction:column;align-items:flex-start;gap:5px">${c ? `<span class="pill ${/^busy|no_answer|unreach|voicem/.test(c.result)?'p-amber':c.result==='reschedule'?'p-green':'p-blue'}">${esc(RES[c.result].label)}</span>` : ''}${ra && cur>0 ? '<span class="pill p-violet">🔔 โทรซ้ำ</span>' : ''}
      <button class="btn sm" data-act="open" data-v="${r.id}|${r.so}">📞 บันทึก</button></div></td></tr>`;
}

/* ---------- แท็บ: ต้องติดตามซ้ำ ---------- */
function viewAlert(alerts){
  let h = `<div class="card"><h3>เกณฑ์การแจ้งเตือนติดตามซ้ำ</h3><div class="rule">
    • <b>ติดต่อได้ - ขอเลื่อน</b> → แจ้งเตือนเมื่อถึงวันที่ลูกค้านัด หากยังไม่พบยอดชำระตามเงื่อนไขการขอเลื่อน<br>
    • <b>สายไม่ว่าง / ไม่รับสาย / ฝากข้อความ</b> → โทรซ้ำภายใน 1 วัน &nbsp;·&nbsp; <b>ปิดเครื่อง/เบอร์ผิด</b> → 2 วัน (หาเบอร์ใหม่จากบุคคลอ้างอิง)<br>
    • <b>ติดต่อได้ - ขอยกเลิกคืนเครื่อง</b> → ติดตามซ้ำหลัง 3 วัน (ส่งเรื่องให้ฝ่ายสัญญา/หัวหน้า)<br>
    • รายการจะหายไปจากรายการนี้เองเมื่อลูกค้าชำระครบ หรือชำระตามที่นัด หรือมีการบันทึกการโทรครั้งใหม่ที่ยังไม่ถึงกำหนดติดตาม</div></div>
    <div class="card"><h3>รายการที่ต้องติดตามซ้ำ (${alerts.length})</h3><div style="overflow-x:auto"><table><thead><tr><th>รหัสลูกค้า</th><th>ชื่อลูกค้า</th><th>คำสั่งซื้อ</th><th>งวดที่ค้าง</th><th class="right">ยอดค้างชำระ (ที่ดึงมา)</th><th>ผู้รับผิดชอบ</th><th>ผลโทรล่าสุด</th><th>เหตุผลที่ต้องติดตาม</th><th>กำหนดติดตาม</th><th></th></tr></thead><tbody>` +
    (alerts.length ? alerts.map(a => `<tr class="click" data-act="open" data-v="${a.r.id}|${a.r.so}"><td class="code">${a.r.id}</td><td style="font-weight:600">${esc(a.r.name)}</td><td class="nowrap" style="color:var(--o2);font-weight:600">${a.r.so}</td>
      <td class="nowrap"><span class="pill p-red">${instLabel(unpaid(a.r).map(i=>i.no))}</span></td><td class="right nowrap" style="font-weight:700;color:#e03131">฿${money(rowSnap(a.r))}</td>
      <td class="nowrap">${a.r.owner ? '<b>'+esc(a.r.owner)+'</b>' : '<span class="pill p-amber">ยังไม่มีผู้รับผิดชอบ</span>'}</td>
      <td><span class="pill p-blue">${esc(RES[a.c.result].label)}</span><div class="muted">${fmtDT(a.c.at)} · ${esc(a.c.by)}</div>${a.c.ptpDate?`<div class="muted" style="color:#c2650a">นัด ${fmtD(a.c.ptpDate)}${a.c.ptpAmt?' ฿'+money(a.c.ptpAmt):''}</div>`:''}</td>
      <td style="max-width:230px">${esc(a.why)}</td>

function saveCall(){

  const customs = Object.keys(T.rates).filter(k=>k!=='default' && T.rates[k]).map(k => k[0]==='Q' ? 'ไตรมาส '+(+k.slice(1)+1) : MONTHS[+k.slice(1)]);
  h += `<div class="card"><h3>💸 อัตราค่าคอมมิชชั่นแต่ละ Tier (ปรับได้ระดับทั้งปี / ไตรมาส / เดือน)</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px"><span class="muted">ช่วงที่กำลังแก้ไข:</span><select data-bind="tScope">${scopes.map(s=>`<option value="${s[0]}" ${sc===s[0]?'selected':''}>${s[1]}${s[0]!=='default'&&T.rates[s[0]]?' ● กำหนดเอง':''}</option>`).join('')}</select>
      ${sc!=='default' ? (own ? `<button class="btn ghost sm" data-act="rateClear">ยกเลิกค่าเฉพาะช่วงนี้ (ใช้ค่าที่สืบทอด)</button>` : `<button class="btn sm" data-act="rateOwn">กำหนดค่าเฉพาะช่วงนี้</button><span class="muted">ตอนนี้ใช้ค่าที่สืบทอดมาจากไตรมาส/ค่าเริ่มต้น</span>`) : ''}
      <span class="muted">ช่วงที่กำหนดเอง: ${customs.length?customs.join(', '):'ไม่มี'} · ลำดับความสำคัญ เดือน › ไตรมาส › ทั้งปี</span></div>
    <table style="max-width:640px"><thead><tr><th>Tier</th><th>บรรลุเป้า ตั้งแต่ (%)</th><th>อัตราค่าคอมมิชชั่น (% ของยอดที่เก็บได้)</th></tr></thead><tbody>` +
    shown.map((t,i) => `<tr><td><b>${esc(t.name)}</b></td><td><input type="number" min="0" step="1" data-bind="rate" data-f="minPct" data-i="${i}" value="${t.minPct}" ${(i===0||(!own&&sc!=='default'))?'disabled':''} style="width:110px"></td><td><input type="number" min="0" step="0.1" data-bind="rate" data-f="rate" data-i="${i}" value="${t.rate}" ${(!own&&sc!=='default')?'disabled':''} style="width:110px"> %</td></tr>`).join('') +
    `</tbody></table><div class="muted" style="margin-top:8px">วิธีคิด (ตัวอย่าง): ค่าคอมมิชชั่น = ยอดที่เก็บได้ × อัตราของ Tier ที่บรรลุเป้า (ใช้อัตราของ Tier สูงสุดที่ถึงเกณฑ์กับยอดทั้งก้อน) — ปรับสูตรได้ภายหลัง</div></div>`;
  // ตัวอย่างผลลัพธ์
  const pv = UI.tPreview, isM = pv[0] === 'm', idx = +pv.slice(1);
  const months = isM ? [idx] : [idx*3, idx*3+1, idx*3+2];
  const rates = ratesFor(T, isM ? {m:idx} : {q:idx});
  const tgtTotal = months.reduce((s,m)=>s+T.monthTarget[m],0);
  let totCol = 0, totCom = 0;
  const lines = STAFF.map(s => { const tgt = tgtTotal * (Number(T.share[s])||0) / 100, col = months.reduce((a,m)=>a+collectedBy(s,m),0), pct = tgt>0 ? col/tgt*100 : 0, tr = tierOf(rates, pct), com = col*tr.rate/100; totCol += col; totCom += com; return { s, tgt, col, pct, tr, com }; });
  h += `<div class="card"><h3>📊 ตัวอย่างผลการเก็บหนี้และค่าคอมมิชชั่น</h3><div style="display:flex;gap:10px;margin-bottom:12px;align-items:center;flex-wrap:wrap"><select data-bind="tPreview">${[0,1,2,3].map(q=>`<option value="q${q}" ${pv==='q'+q?'selected':''}>ไตรมาส ${q+1}</option>`).join('')}${MONTHS.map((m,i)=>`<option value="m${i}" ${pv==='m'+i?'selected':''}>เดือน ${m}</option>`).join('')}</select><span class="muted">ยอดเก็บได้ = ตัวอย่างข้อมูลเดือนก่อนหน้า + ยอดรับชำระที่บันทึกในต้นแบบนี้ (นับให้พนักงานที่โทรล่าสุดของลูกค้ารายนั้น)</span></div>
    <div style="overflow-x:auto"><table><thead><tr><th>พนักงาน</th><th class="right">เป้าหมาย</th><th class="right">เก็บได้</th><th style="min-width:160px">% บรรลุเป้า</th><th>Tier</th><th class="right">อัตรา</th><th class="right">ค่าคอมมิชชั่น</th></tr></thead><tbody>` +
    lines.map(l => `<tr><td><b>${esc(l.s)}</b></td><td class="right nowrap">฿${money(l.tgt)}</td><td class="right nowrap">฿${money(l.col)}</td><td><div class="progress"><i style="width:${Math.min(100,l.pct)}%"></i></div><div class="muted">${l.pct.toFixed(1)}%</div></td><td><span class="pill ${l.pct>=100?'p-green':l.pct>=80?'p-amber':'p-gray'}">${esc(l.tr.name)}</span></td><td class="right">${l.tr.rate}%</td><td class="right nowrap" style="font-weight:700;color:#0b7a5b">฿${money(l.com)}</td></tr>`).join('') +
    `<tr style="background:rgba(247,130,59,.06);font-weight:700"><td>รวมทีม</td><td class="right">฿${money(tgtTotal)}</td><td class="right">฿${money(totCol)}</td><td>${tgtTotal>0?(totCol/tgtTotal*100).toFixed(1):0}%</td><td></td><td></td><td class="right">฿${money(totCom)}</td></tr></tbody></table></div></div>`;
  return h;
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v;
  if (a === 'tab') { UI.tab = v; render(); }
  else if (a === 'noop') { return; }
  else if (a === 'claim') {
    const r = findRow(v); if (!r) return;
    if (r.owner) { toast('ลูกค้ารายนี้มีผู้รับผิดชอบแล้ว: ' + r.owner); render(); return; }   // กันกดซ้อน/ถูกรับไปก่อน
    setOwner(r, S.user, 'พนักงานกดรับเป็นของตัวเอง');
    toast('✓ ลูกค้ารายนี้เป็นของ ' + S.user + ' แล้ว — พนักงานคนอื่นจะเห็นว่ามีผู้รับผิดชอบ'); render();
  }
  else if (a === 'bucket') { UI.bucket = v; UI.dueDay = 'all'; UI.tab = 'work'; render(); }
  else if (a === 'dueDay') { UI.dueDay = v; render(); }
  else if (a === 'open') { openModal(v); }
  else if (a === 'close') { UI.modal = null; render(); }
  else if (a === 'closeMask') { if (e.target === t) { UI.modal = null; render(); } }
  else if (a === 'xferOpen') { UI.xfer = { v, whyS:'', why:'' }; renderXfer(); }
  else if (a === 'xferClose') { UI.xfer = null; renderXfer(); }
  else if (a === 'xferMask') { if (e.target === t) { UI.xfer = null; renderXfer(); } }
  else if (a === 'xferConfirm') {
    const x = UI.xfer, r = findRow(x.v); if (!r) return;
    if (!(isAdmin() || r.owner === S.user)) return toast('โอนได้เฉพาะเจ้าของเคสหรือ Admin');
    if (!x.whyS) return toast('กรุณาเลือกเหตุผลที่โอน');
    const from = r.owner;
    const reason = x.whyS + (x.why.trim() ? ' — ' + x.why.trim() : '');
    setOwner(r, null, 'โอนเคสคืนให้ทีม โดย ' + S.user + ' — ' + reason, true, reason);
    UI.xfer = null; toast('✓ โอนเคสแล้ว — บันทึกประวัติของ ' + from + ' ไว้ และเปิดให้พนักงานคนอื่นรับเป็นของฉัน'); render();
  }
  else if (a === 'saveCall') saveCall();
  else if (a === 'savePay') savePay();
  else if (a === 'reset') { if (confirm('รีเซ็ตกลับเป็นข้อมูลตัวอย่างเริ่มต้น?')) { localStorage.removeItem(KEY); S = load(); UI.modal = null; render(); } }
  else if (a === 'rateOwn') { const sc = UI.tScope; S.target.rates[sc] = JSON.parse(JSON.stringify(ratesFor(S.target, sc[0]==='M' ? {m:+sc.slice(1)} : {q:+sc.slice(1)}))); save(); render(); }
  else if (a === 'rateClear') { delete S.target.rates[UI.tScope]; save(); render(); }
});
document.addEventListener('input', e => {
  const t = e.target, b = t.dataset && t.dataset.bind; if (!b) return;
  if (b === 'q') { UI.q = t.value; render(); const el = document.getElementById('qBox'); if (el) { el.focus(); el.setSelectionRange(t.value.length, t.value.length); } return; }
  if (b === 'xferWhy' && UI.xfer) { UI.xfer.why = t.value; return; }
  if (UI.modal && UI.draft && ['note','ptpAmt','payAmt'].indexOf(b) !== -1) { UI.draft[b] = t.value; return; }
  if (b === 'mt') { S.target.monthTarget[+t.dataset.i] = Number(t.value)||0; save(); }
  else if (b === 'share') { S.target.share[t.dataset.s] = Number(t.value)||0; save(); }
  else if (b === 'rate') { const arr = UI.tScope==='default' ? S.target.rates.default : S.target.rates[UI.tScope]; if (arr) { arr[+t.dataset.i][t.dataset.f] = Number(t.value)||0; save(); } }
});
document.addEventListener('change', e => {
  const t = e.target, b = t.dataset && t.dataset.bind; if (!b) return;
  if (b === 'user') { S.user = t.value; save(); render(); }
  else if (b === 'staffF') { UI.staff = t.value; render(); }
  else if (b === 'owner') {
    const r = findRow(t.dataset.v); if (!r) return;
    const to = t.value || null;
    if (!isAdmin() && (r.owner || (to && to !== S.user))) { toast('เลือกได้เฉพาะรับเป็นของตัวเอง'); render(); return; }
    setOwner(r, to, isAdmin() ? 'Admin กำหนด/โอนผู้รับผิดชอบ' : 'พนักงานเลือกรับเป็นของตัวเอง');
    toast(to ? 'ลูกค้ารายนี้เป็นของ ' + to + ' แล้ว' : 'ปล่อยลูกค้ารายนี้เป็น "ยังไม่มีผู้รับผิดชอบ"'); render();
  }
  else if (b === 'tScope') { UI.tScope = t.value; render(); }
  else if (b === 'tPreview') { UI.tPreview = t.value; render(); }
  else if (b === 'nos') { const n = Number(t.value), i = UI.draft.nos.indexOf(n); if (t.checked && i === -1) UI.draft.nos.push(n); if (!t.checked && i !== -1) UI.draft.nos.splice(i,1); }
  else if (b === 'result') { UI.draft.result = t.value; if (t.value === 'reschedule') UI.draft.ptpAmt = reschedulePlan(findRow(UI.modal), UI.draft.ptpDate).now || ''; renderModal(); }
  else if (b === 'ptpDate') { UI.draft.ptpDate = t.value; renderModal(); }
  else if (b === 'payDate') UI.draft.payDate = t.value;
  else if (b === 'xferWhyS') { UI.xfer.whyS = t.value; }
  else if (['mt','share','rate'].indexOf(b) !== -1) render();
});
render();
</script>
</body>
</html>
